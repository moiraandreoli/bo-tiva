:root {
  /* ---------- Color: marca / navegación ---------- */
  --bims-navy:            #023d6c;  /* topbar, tiles secundarios */
  --bims-navy-deep:       #13294d;  /* tile activo/hover (~) */
  --bims-logo-blue:       #25a0fd;  /* bloque del logo (navbar-brand) */
  --bims-blue:            #3a78d0;  /* tiles "uso frecuente" */
  --bims-primary:         #70b3f9;  /* btn-primary (CREAR) */
  --bims-primary-border:  #3f99f7;
  --bims-primary-hilite:  #88c0fa;  /* inset superior del btn-primary */
  --bims-accent:          #1e88e5;
  --bims-link:            #298ef7;  /* links */
  --bims-badge:           #e5332a;  /* contador de notificaciones */

  /* ---------- Color: superficies ---------- */
  --bims-bg-page:         #edf3f6;  /* fondo del área de contenido */
  --bims-bg-white:        #ffffff;
  --bims-bg-sidebar:      #f7f7f7;
  --bims-bg-sidebar-act:  #ececec;  /* ítem activo del sidebar */
  --bims-bg-subtle:       #f8f8f8;  /* filas de totales, barra de contexto, encabezado de card */
  --bims-bg-readonly:     #f2f2f2;  /* input deshabilitado (RUC/CI) */
  --bims-bg-highlight:    #fbf5dc;  /* número de comprobante */

  /* ---------- Color: bordes ---------- */
  --bims-border:          #dae2e5;  /* tablas, cards, inputs */
  --bims-border-strong:   #dae2e5;  /* botones de grupo (mismo que border) */

  /* ---------- Color: texto ---------- */
  --bims-text:            #333333;  /* títulos, datos */
  --bims-text-strong:     #333333;  /* prod usa #333 también en bold */
  --bims-text-secondary:  #666666;
  --bims-text-muted:      #8a8f94;  /* (~) */  /* ítems de sidebar, labels secundarios */
  --bims-text-placeholder:#bbc9ce;
  --bims-text-btn-group:  #a4b0b4;  /* botones de grupo en mayúsculas */
  --bims-text-on-dark:    #ffffff;

  /* ---------- Tipografía ---------- */
  /* Prod parece usar Proxima Nova. Figtree es el reemplazo libre más cercano. */
  --bims-font: "Proxima Nova Rg", "Proxima Nova", "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bims-font-bold: "Proxima Nova Bold", "Proxima Nova", "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --fs-xs:   11px;  /* "USO FRECUENTE" */
  --fs-sm:   12px;  /* botones, badges */
  --fs-base: 14px;  /* cuerpo, celdas, sidebar */
  --fs-md:   15px;  /* celdas de totales (~) */
  --fs-lg:   18px;  /* "Factura" (tipo de comprobante) (~) */
  --fs-xl:   21px;  /* título de página */
  --fs-brand: 18px; /* logo */
  --fs-hero: 28px;  /* "¿Qué desea hacer ahora?" */
  --fw-regular: 400;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* ---------- Layout ---------- */
  --topbar-h:   52px;
  --subbar-h:   52px;  /* topbar + subbar = 104px (padding-top del body en prod) */
  --sidebar-w:  175px; /* (~) */
  --page-header-h: 45px;
  --gutter:     14px;   /* margen del contenido respecto a sidebar/bordes */

  /* ---------- Espaciado ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;

  /* ---------- Forma ---------- */
  --radius-sm: 2px;   /* inputs, botones, th */
  --radius-md: 4px;   /* modales */
  --radius-pill: 10px; /* badges */
  --radius-0:  0;     /* tablas, cards, tiles: esquinas rectas */
  --shadow-btn: inset 0 1px 0 var(--bims-primary-hilite), 0 1px 2px #c4c4c4;
  --shadow-modal: 0 5px 15px rgba(0,0,0,.5);
  --shadow-panel: 0 1px 1px rgba(0,0,0,.05);   /* .panel de prod */
  --shadow-field: inset 0 1px 1px rgba(0,0,0,.075); /* select.form-control */
  --line: 20px;
}

/* =========================================================
   Base
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--bims-font);
  font-size: var(--fs-base);
  line-height: var(--line);
  color: var(--bims-text);
  background: var(--bims-bg-page);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--bims-link); text-decoration: none; }
b, strong, th, label, .bims-label, .bims-btn, .bims-btn-group > *, .bims-badge, .bims-topbar__logo { font-family: var(--bims-font-bold); font-weight: 700; }
a:hover { text-decoration: underline; }

/* =========================================================
   Shell: topbar + subbar + sidebar + contenido
   ========================================================= */
.bims-app { min-height: 100vh; display: flex; flex-direction: column; }

.bims-topbar {
  height: var(--topbar-h);
  display: flex; align-items: stretch;
  background: var(--bims-navy);
  color: var(--bims-text-on-dark);
}
.bims-topbar__logo {
  width: var(--sidebar-w); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bims-logo-blue);
  font-family: var(--bims-font-bold); font-size: var(--fs-brand); text-transform: uppercase;
}
.bims-topbar__nav {
  flex: 1; display: flex; align-items: center;
  gap: 16px; padding-left: 31px; min-width: 0; overflow: hidden;
  font-size: var(--fs-sm); text-transform: uppercase; /* (~) */
}
.bims-topbar__nav a { color: #fff; white-space: nowrap; }
.bims-topbar__nav a::after {
  content: ""; display: inline-block; margin-left: 3px; vertical-align: 2px;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
}
.bims-topbar__nav a:hover { text-decoration: none; opacity: .85; }
.bims-topbar__right { flex-shrink: 0; margin-left: 16px; display: flex; align-items: center; gap: 30px; padding-right: 15px; }
.bims-topbar__icon { position: relative; width: 20px; height: 20px; opacity: .9; }
.bims-topbar__badge {
  position: absolute; top: -8px; right: -8px;
  min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--bims-badge); color: #fff;
  font-size: 9px; font-weight: var(--fw-bold); line-height: 15px; text-align: center;
}
.bims-avatar { width: 30px; height: 30px; border-radius: 50%; background: #9aa3ab; }

.bims-subbar {
  height: var(--subbar-h);
  display: flex; align-items: center;
  background: var(--bims-bg-white);
  border-bottom: 1px solid var(--bims-border);
}
.bims-subbar__actions { width: var(--sidebar-w); display: flex; justify-content: space-around; color: #9aa0a6; }
.bims-subbar__crumb { padding-left: 38px; font-size: var(--fs-sm); text-transform: uppercase; color: var(--bims-text); }
.bims-search {
  margin-left: auto; margin-right: 10px;
  width: 170px; height: 34px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
  border: 1px solid var(--bims-border); border-radius: var(--radius-sm);
  color: var(--bims-text-placeholder); font-size: var(--fs-base);
}

.bims-body { flex: 1; display: flex; }

.bims-sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bims-bg-sidebar);
  border-right: 1px solid var(--bims-border);
  padding-top: 18px;
}
.bims-sidebar__item {
  display: block; padding: 10px 15px;
  font-size: var(--fs-base); line-height: var(--line);
  color: var(--bims-text-muted);
  border-bottom: 1px solid #ececec;
}
.bims-sidebar__item:hover { text-decoration: none; color: var(--bims-text); }
.bims-sidebar__item.is-active { background: var(--bims-bg-sidebar-act); color: var(--bims-text); }
.bims-sidebar__cta { padding: 8px 13px 18px; }

.bims-main { flex: 1; min-width: 0; }

/* =========================================================
   Page header
   ========================================================= */
.bims-page-header {
  min-height: var(--page-header-h);
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 7px 10px 7px var(--gutter);
  background: var(--bims-bg-white);
  border-bottom: 1px solid var(--bims-border);
}
.bims-page-header__title { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-regular); color: var(--bims-text); }
.bims-page-header__tools { margin-left: auto; display: flex; gap: var(--sp-4); }

.bims-page-content { padding: 18px var(--gutter); }
.bims-table-wrap { overflow-x: auto; }  /* envolver tablas anchas */

/* =========================================================
   Botones
   ========================================================= */
.bims-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 31px; padding: 6px 12px;
  font-size: var(--fs-sm);
  text-transform: uppercase; cursor: pointer;
  border-radius: var(--radius-sm);
}
.bims-btn--primary {
  width: 100%;
  background: var(--bims-primary); color: #fff;
  border: 1px solid var(--bims-primary-border);
  box-shadow: var(--shadow-btn);
}
.bims-btn--primary:hover { background: var(--bims-primary-border); }

/* Grupo de botones segmentados (HOY / ESTE MES / ...) */
.bims-btn-group { display: inline-flex; border: 1px solid var(--bims-border-strong); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
.bims-btn-group > * {
  height: 35px; padding: 5px 10px;
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 0; border-left: 1px solid var(--bims-border-strong);
  font-size: var(--fs-sm);
  color: var(--bims-text-btn-group); text-transform: uppercase; cursor: pointer;
}
.bims-btn-group > *:first-child { border-left: 0; }
.bims-btn-group > *:hover { background: var(--bims-bg-subtle); }
.bims-btn-group--icons > * { width: 38px; padding: 0; }

/* =========================================================
   Barra de contexto / filtros (Estado · Contacto · Desde · Hasta)
   ========================================================= */
.bims-context-bar {
  display: flex;
  background: var(--bims-bg-subtle);
  border: 1px solid var(--bims-border);
  margin-bottom: 18px;
}
.bims-context-bar__item {
  flex: 0 0 auto; width: 181px; min-width: 0;
  padding: 11px 9px; text-align: center;
  border-right: 1px solid var(--bims-border);
}
.bims-context-bar--fill .bims-context-bar__item { flex: 1; width: auto; }
.bims-context-bar--fill .bims-context-bar__item:last-child { border-right: 0; }
.bims-context-bar__spacer { flex: 1; background: #fff; }
.bims-context-bar__label { font-size: var(--fs-base); color: var(--bims-text); }
.bims-context-bar__value {
  margin-top: 3px; font-size: var(--fs-base); font-weight: var(--fw-bold); color: var(--bims-text-strong);
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}
.bims-caret::after {
  content: ""; display: inline-block; margin-left: 6px; vertical-align: 3px;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
}

/* =========================================================
   Tabla
   ========================================================= */
.bims-table {
  width: 100%; border-collapse: collapse;
  background: var(--bims-bg-white);
  border: 1px solid var(--bims-border);
  font-size: var(--fs-base);
}
.bims-table th, .bims-table td {
  padding: 8px; height: 37px;

.split { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const gs = n => n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("es-PY").replace(/,/g, ".");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const get = n => LIQS.find(l => l.n === n);
const adicTotal = l => l.adic.reduce((a, x) => a + x.h, 0);
const total = l => l.planMonto + adicTotal(l);
const recibidoPrevio = l => l.comps.filter(c => c.estado === "parcial").reduce((a, c) => a + c.recibido, 0);
const aValidar = l => total(l) - recibidoPrevio(l);
const actual = l => l.comps[l.comps.length - 1];
const count = e => LIQS.filter(l => l.estado === e).length;
const parseM = v => { const m = parseInt(String(v).replace(/\D/g, ""), 10); return isNaN(m) ? null : m; };
function dupOf(op, self) {
  const o = (op || "").trim().toLowerCase(); if (!o) return null;
  for (const l of LIQS) for (const c of l.comps) if ((l.n !== self) && c.estado !== "revision" && c.estado !== "rechazado" && c.r.op.toLowerCase() === o) return { l, c };
  return null;
}
function estadoBadge(l) {
  return { revision:'<span class="st st--warn">En revisión</span>', parcial:'<span class="st st--info">Esperando diferencia</span>',
           aprobado:'<span class="st st--ok">Pago aprobado</span>', rechazado:'<span class="st st--err">Pago rechazado</span>' }[l.estado];
}
const now = () => HOY + " 09:" + String(30 + Math.floor(Math.random() * 25)).padStart(2, "0");

function verifyPanel(l) {
  const esperado = aValidar(l);
  const m = parseM(draft.monto), has = m !== null;
  const diff = has ? m - esperado : null;
  const dup = dupOf(draft.op, l.n);
  const filled = has && draft.op.trim() && draft.fecha;
  let alert = "", primary = "";
  if (dup) alert = `<div class="alert alert--warn">Este número de operación ya se usó en la <a href="#">liquidación #${dup.l.n}</a> (${dup.l.el.slice(0,10)}). Es probable que el cliente haya cargado un comprobante anterior. Rechazá el pago.</div>`;
  else if (has && diff === 0) alert = `<div class="alert alert--ok">El monto recibido coincide con el monto a validar.</div>`;
  else if (has && diff < 0) alert = `<div class="alert alert--warn">Recibido Gs. ${gs(m)} de Gs. ${gs(esperado)}. Faltan <b>Gs. ${gs(-diff)}</b>.<br>Con la prórroga parcial, la cuenta queda activa 7 días más (hasta el 12-10-2026) y le enviamos al cliente el saldo a transferir.</div>`;
  else if (has && diff > 0) alert = `<div class="prd-gap"><b>Caso no definido en el PRD:</b> el monto recibido supera el monto a validar por Gs. ${gs(diff)}. En el proto se puede aprobar con una observación.</div>`;

  const okAprobar = filled && !dup && (diff === 0 || (diff > 0 && draft.obs.trim()));
  const okProrroga = filled && !dup && diff < 0;
  if (has && diff < 0 && !dup) primary = `<button type="button" class="bims-btn bims-btn--primary bims-btn--auto" data-prorroga ${okProrroga?"":"disabled"}>Aplicar prórroga parcial</button>`;
  else primary = `<button type="submit" class="bims-btn bims-btn--primary bims-btn--auto" ${okAprobar?"":"disabled"}>Aprobar pago</button>`;

  return `<form class="panel" id="verForm" novalidate>
    <div class="panel__head"><span class="panel__title">Validación</span><span class="small muted">Asignado a ${esc(l.tomado)}</span></div>
    <div class="panel__body">
      <div class="hint" style="margin:0 0 10px">Completá con los datos que figuran en el comprobante.</div>
      <div class="grid2">
        <div class="bims-field"><label class="bims-label" for="v-monto">Monto recibido <span class="req">*</span></label>
          <div class="bims-input-group"><input id="v-monto" class="bims-input tabnum" style="text-align:right" value="${esc(draft.monto)}" inputmode="numeric" placeholder="0"><span class="bims-input-group__addon small">Gs.</span></div></div>
        <div class="bims-field"><label class="bims-label" for="v-fecha">Fecha de transferencia <span class="req">*</span></label>
          <input id="v-fecha" type="date" class="bims-input" value="${draft.fecha}"></div>
      </div>
      <div class="bims-field"><label class="bims-label" for="v-op">Nro. de operación <span class="req">*</span></label>
        <input id="v-op" class="bims-input" value="${esc(draft.op)}" autocomplete="off"></div>
      ${alert}
      ${has && diff > 0 && !dup ? `<div class="bims-field"><label class="bims-label" for="v-obs">Observación <span class="req">*</span></label><textarea id="v-obs" class="bims-input">${esc(draft.obs)}</textarea></div>` : ""}
      <div class="hint">${has && diff < 0 && !dup ? "Al aplicar la prórroga, el pago pasa a Esperando diferencia." : "Al aprobar, se renueva la suscripción y le enviamos al cliente la factura electrónica por mail."}</div>
    </div>
    <div class="actions">
      <button type="button" class="bims-btn bims-btn--default bims-btn--auto" data-rechazar>Rechazar pago</button>
      ${primary}
    </div></form>`;
}

function resultPanel(l) {
  const c = actual(l);
  const body = {
    aprobado:`<div class="alert alert--ok" style="margin:0">${esc(l.por)} aprobó el pago el ${l.el}.</div>`,
    rechazado:`<div class="alert alert--warn" style="margin:0">${esc(l.por)} rechazó el pago el ${l.el}. Motivo: ${esc(c.motivo)}.</div>`,
    parcial:`<div class="alert alert--info" style="margin:0">${esc(l.por)} aplicó prórroga parcial el ${l.el}. Falta que el cliente transfiera <b>Gs. ${gs(aValidar(l))}</b> antes del ${l.limite}.</div>`,
  }[l.estado];
  return `<div class="panel"><div class="panel__head"><span class="panel__title">Validación</span></div><div class="panel__body">${body}</div></div>`;
}

function renderDetail() {
  const l = get(view.n);
  $("#crumb").innerHTML = `Validación de pagos <span class="muted">›</span> Liquidación #${l.n}`;
  const mine = l.estado === "revision" && l.tomado === ME;
  const other = l.estado === "revision" && l.tomado && l.tomado !== ME;
  const free = l.estado === "revision" && !l.tomado;
  const c = l.comps.find(x => x.id === compSel) || actual(l);
  $("#main").innerHTML = `
    <div class="bims-page-header"><h1 class="bims-page-header__title">Validar pago · Liquidación SaaS #${l.n}</h1><div class="bims-page-header__tools">${estadoBadge(l)}</div></div>
    <div class="bims-page-content">
      <div class="mobile-nav"><button class="bims-btn bims-btn--default bims-btn--sm" data-back>‹ Volver a la bandeja</button></div>
      ${free ? `<div class="alert alert--info" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>Este caso no está asignado. Asignátelo para validar el pago.</span><button class="bims-btn bims-btn--primary bims-btn--sm" data-tomar>Asignarme</button></div>` : ""}
      ${other ? `<div class="alert alert--info">Este caso está asignado a ${esc(l.tomado)}. Solo podés consultarlo.</div>` : ""}
      ${l.estado === "revision" ? `<div class="small" style="margin:-4px 0 12px">Validar antes del <span class="${l.vence==='hoy'?'due':''}">${l.limite}</span>${l.vence==='hoy'?' · vence hoy':''}</div>` : ""}
      <div class="panel" style="margin-bottom:18px"><div class="panel__body"><div class="liq-head">
        <div><div class="company">${esc(l.razon)}</div><div class="muted">RUC ${l.ruc}</div>
          <dl class="meta tabnum" style="margin:12px 0 0">
            <dt>Abonado SaaS</dt><dd><a href="#">${l.abonado}</a></dd>
            <dt>Representante</dt><dd>${esc(l.rep)}</dd>
            <dt>Estado de la cuenta</dt><dd>${l.cuenta}</dd>
          </dl></div>
        <div class="liq-num tabnum"><div class="liq-num__label">Liquidación SaaS</div><div class="liq-num__value">${l.n}</div>
          <div class="liq-num__label" style="margin-top:10px">Cuenta destino</div><div class="small">${CUENTA}</div></div>
      </div></div></div>

      ${PREVIEW ? "" : `<div class="split">
        <div style="min-width:0">${filesPanel(l)}${montoPanel(l)}</div>
        <div style="min-width:0">${mine ? verifyPanel(l) : l.estado === "revision" ? "" : resultPanel(l)}</div>
      </div>`}
      <div class="split" id="previewSplit">
        <div class="panel">
          <div class="panel__head"><span class="panel__title">Comprobante</span><span class="small muted">Cargado por el cliente en Mi BIMS</span></div>
          <div class="panel__body">
            ${l.comps.length > 1 ? `<div class="comp-tabs">${l.comps.map(x => `<button class="bims-btn ${x.id===c.id?'bims-btn--primary':'bims-btn--default'} bims-btn--sm" data-comp="${x.id}">Comprobante ${x.id}${x.estado==="parcial"?" · parcial":x.estado==="revision"?" · a validar":""}</button>`).join("")}</div>` : ""}
            ${receipt(c)}
          </div>
        </div>
        <div style="min-width:0">
          ${montoPanel(l)}
          ${mine ? verifyPanel(l) : l.estado === "revision" ? "" : resultPanel(l)}
        </div>
      </div>

      <div class="panel" style="margin-top:18px">
        <div class="panel__head"><span class="panel__title">Actividad</span><span class="small muted">Trazabilidad para Administración</span></div>
        <div class="panel__body"><ul class="timeline">${l.log.slice().reverse().map(([f, t]) => `<li><span>${f}</span><span>${esc(t)}</span></li>`).join("")}</ul></div>
      </div>
    </div>`;
  if (!PREVIEW) { const ps = $("#previewSplit"); if (ps) ps.remove(); }
}


/* ---------- Variante sin vista previa ---------- */
const FILEINFO = n => ({ size: (180 + (n * 37) % 300) + " KB" });
function filesPanel(l) {
  return `<div class="panel" style="margin-bottom:18px"><!-- NUEVO: no validado contra prod -->
    <div class="panel__head"><span class="panel__title">Comprobante${l.comps.length>1?"s":""}</span><span class="small muted">Cargado por el cliente en Mi BIMS</span></div>
    <div class="panel__body" style="padding:0">
      ${l.comps.slice().reverse().map(c => {
        const pdf = /\.pdf$/i.test(c.archivo);
        return `<div style="display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--bims-border)">
          <svg width="28" height="34" viewBox="0 0 28 34" aria-hidden="true"><path d="M2 1h17l7 7v25H2z" fill="#fff" stroke="#b9c6cc" stroke-width="1.5"/><path d="M19 1v7h7" fill="none" stroke="#b9c6cc" stroke-width="1.5"/><rect x="0" y="18" width="20" height="10" rx="1" fill="${pdf?'#c9302c':'#3a78d0'}"/><text x="10" y="25.5" text-anchor="middle" font-size="7" font-family="Arial" font-weight="700" fill="#fff">${pdf?'PDF':'IMG'}</text></svg>
          <div style="flex:1;min-width:0">
            <div style="overflow-wrap:anywhere"><b>${esc(c.archivo)}</b>${l.comps.length>1?` <span class="small muted">· Comprobante ${c.id}${c.estado==="parcial"?" (parcial)":c.estado==="revision"?" (a validar)":""}</span>`:""}</div>
            <div class="small muted">${FILEINFO(l.n + c.id).size} · cargado el ${c.cargado}</div>
          </div>
          <button class="bims-btn bims-btn--default bims-btn--sm" data-file="${c.id}">Abrir comprobante</button>
        </div>`; }).join("")}
    </div></div>`;
}
function openFile(id) {
  const l = get(view.n), c = l.comps.find(x => x.id === id);
  openModal(`<div class="bims-modal__head">${esc(c.archivo)}</div>
    <div class="bims-modal__body">${receipt(c)}<div class="hint" style="margin-top:8px">En el producto se abre en una pestaña nueva. Acá se simula con un modal.</div></div>
    <div class="bims-modal__foot"><button class="bims-btn bims-btn--default bims-btn--auto" data-close>Cerrar</button></div>`);
}

/* ---------- Modales ---------- */
function openModal(h) { $("#overlay").innerHTML = `<div class="bims-modal-backdrop" data-close-bg><div class="bims-modal" role="dialog" aria-modal="true">${h}</div></div>`; }
function closeModal() { $("#overlay").innerHTML = ""; }
function openReject() {
  const l = get(view.n);
  const def = dupOf(draft.op, l.n) ? 3 : 0;
  openModal(`<div class="bims-modal__head">Rechazar pago</div>
    <div class="bims-modal__body">
      <div class="bims-field"><label class="bims-label" for="r-motivo">Motivo</label>
        <select id="r-motivo" class="bims-input">${MOTIVOS.map((m,i) => `<option value="${i}" ${i===def?"selected":""}>${m}</option>`).join("")}</select>
        <div class="hint">Le enviamos el motivo al cliente por mail para que vuelva a cargar el comprobante.</div></div>
    </div>
    <div class="bims-modal__foot"><button class="bims-btn bims-btn--default bims-btn--auto" data-close>Cancelar</button><button class="bims-btn bims-btn--primary bims-btn--auto" data-ok-rechazar>Rechazar pago</button></div>`);
}
function openProrroga() {
  const l = get(view.n), m = parseM(draft.monto), esp = aValidar(l);
  openModal(`<div class="bims-modal__head">Aplicar prórroga parcial</div>
    <div class="bims-modal__body tabnum">
      <div class="kv"><span>Monto a validar</span><span>Gs. ${gs(esp)}</span></div>
      <div class="kv"><span>Recibido</span><span>Gs. ${gs(m)}</span></div>
      <div class="kv"><span><b>Diferencia a transferir</b></span><b class="diff">Gs. ${gs(esp - m)}</b></div>
      <div class="alert alert--info" style="margin:12px 0 0">La cuenta queda activa hasta el 12-10-2026. Le enviamos al cliente el mail de pago incompleto con la diferencia y los datos de la cuenta.</div>
    </div>
    <div class="bims-modal__foot"><button class="bims-btn bims-btn--default bims-btn--auto" data-close>Cancelar</button><button class="bims-btn bims-btn--primary bims-btn--auto" data-ok-prorroga>Aplicar prórroga</button></div>`);
}
function toast(t, b) {
  $("#toastHost").innerHTML = `<div class="toast" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--st-ok-fg)" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg><div><b>${t}</b><span class="small muted">${b}</span></div></div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => $("#toastHost").innerHTML = "", 4500);
}
const back = () => { view = { name:"list", tab:"revision", filtro:"todos" }; render(); };

function renderSwitch() {
  let sw = $("#protoSwitch");
  if (!sw) { sw = document.createElement("div"); sw.id = "protoSwitch"; sw.className = "proto-switch"; document.body.prepend(sw); }
  sw.innerHTML = `<b>Opción:</b><button class="${PREVIEW?'is-on':''}" data-preview="1">A · Con vista previa del comprobante</button><button class="${!PREVIEW?'is-on':''}" data-preview="0">B · Sin vista previa</button>`;
}
function render() { renderSwitch(); renderSidebar(); renderBell(); view.name === "list" ? renderList() : renderDetail(); }
function rerenderKeep(id) { const el = $("#"+id), pos = el && el.selectionStart; render(); const n = $("#"+id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } }

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const pv = e.target.closest("[data-preview]");
  if (pv) { PREVIEW = pv.dataset.preview === "1"; try { history.replaceState(null, "", PREVIEW ? "#con-preview" : "#sin-preview"); } catch (_) {} render(); return; }
  const el = e.target.closest("[data-bell],[data-tab],[data-filtro],[data-open],[data-back],[data-tomar],[data-adic],[data-comp],[data-rechazar],[data-prorroga],[data-close],[data-close-bg],[data-ok-rechazar],[data-ok-prorroga],[data-file]");
  if (!el) { if (notifOpen && !e.target.closest("#notif")) { notifOpen = false; renderBell(); } return; }
  if (el.matches("a")) e.preventDefault();
  const d = el.dataset;
  if (d.closeBg !== undefined && e.target !== el) return;
  if (d.bell) { notifOpen = !notifOpen; renderBell(); }
  else if (d.tab) { view = { name:"list", tab:d.tab, filtro:"todos" }; render(); }
  else if (d.filtro) { view.filtro = d.filtro; render(); }
  else if (d.open) open(+d.open);
  else if (d.back !== undefined) back();
  else if (d.tomar !== undefined) { tomar(get(view.n)); render(); toast("Te asignaste el caso", "Los demás agentes lo ven asignado a vos."); }
  else if (d.adic !== undefined) { showAdic = !showAdic; render(); }
  else if (d.file) openFile(+d.file);
  else if (d.comp) { compSel = +d.comp; render(); }
  else if (d.rechazar !== undefined) openReject();
  else if (d.prorroga !== undefined) openProrroga();
  else if (d.close !== undefined || d.closeBg !== undefined) closeModal();
  else if (d.okRechazar !== undefined) {
    const l = get(view.n), motivo = MOTIVOS[+$("#r-motivo").value], t = now();
    Object.assign(actual(l), { estado:"rechazado", motivo });
    Object.assign(l, { estado:"rechazado", por:ME, el:t });
    l.log.push([t, `${ME} rechazó el pago. Motivo: ${motivo}.`], [t, "Se envió al cliente el mail de pago rechazado."]);
    closeModal(); back(); toast(`Rechazaste el pago de la liquidación #${l.n}`, "Le avisamos al cliente por mail para que vuelva a cargar el comprobante.");
  }
  else if (d.okProrroga !== undefined) {
    const l = get(view.n), m = parseM(draft.monto), esp = aValidar(l), t = now();
    Object.assign(actual(l), { estado:"parcial", recibido:m, por:ME, el:t });
    Object.assign(l, { estado:"parcial", por:ME, el:t, limite:"12-10-2026", cuenta:"Activa por prórroga hasta 12-10-2026" });
    l.log.push([t, `${ME} aplicó prórroga parcial de 7 días. Recibido Gs. ${gs(m)} de Gs. ${gs(esp)}.`], [t, "Se envió al cliente el mail de pago incompleto."]);
    closeModal(); back(); toast(`Aplicaste la prórroga parcial a la liquidación #${l.n}`, `Le pedimos al cliente que transfiera Gs. ${gs(esp - m)}.`);
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "v-monto") { draft.monto = e.target.value; rerenderKeep(id); }
  if (id === "v-op") { draft.op = e.target.value; rerenderKeep(id); }
  if (id === "v-obs") { draft.obs = e.target.value; const b = $("#verForm button[type=submit]"); if (b) b.disabled = !draft.obs.trim() || !draft.op.trim() || !draft.fecha; }
});
document.addEventListener("focusout", e => {
  if (e.target.id === "v-monto") { const m = parseM(draft.monto); if (m !== null) { draft.monto = gs(m); e.target.value = draft.monto; } }
});
document.addEventListener("change", e => { if (e.target.id === "v-fecha") { draft.fecha = e.target.value; render(); } });
document.addEventListener("submit", e => {
  if (e.target.id !== "verForm") return;
  e.preventDefault();
  const l = get(view.n), m = parseM(draft.monto), t = now();
  Object.assign(actual(l), { estado:"aprobado", recibido:m, op:draft.op });
  actual(l).r.op = draft.op.trim() || actual(l).r.op;
  Object.assign(l, { estado:"aprobado", por:ME, el:t });
  l.log.push([t, `${ME} aprobó el pago por Gs. ${gs(m)}.`], [t, "Se renovó la suscripción y se envió la factura electrónica al cliente."]);
  back(); toast(`Aprobaste el pago de la liquidación #${l.n}`, "Renovamos la suscripción y le enviamos la factura electrónica al cliente.");
});
window.addEventListener("hashchange", () => { PREVIEW = location.hash !== "#sin-preview"; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); notifOpen = false; renderBell(); } });

/* Abrir un caso libre lo muestra con "Asignarme"; abrir uno propio permite validar */
render();
</script>

</body>
</html>
